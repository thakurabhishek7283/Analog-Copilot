id: bias_2v5
version: 1
role: bias
title: Buffered 2.5 V reference (LM358, 5 V supply)
teach: "Equal resistors split the regulated 5 V rail; an LM358 follower buffers the midpoint so filter currents do not move the bias. The unused amplifier is also wired as a separate follower."
ports: {out: output, vcc: power_pos, gnd: ground}
rails:
  vcc: {net: V5, volts: 5}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  C1: {part: cap_film}
  U1: {part: opamp_lm358}
nets:
  vcc: [R1.1, C1.1, U1.VCC]
  midpoint: [R1.2, R2.1, U1.INP_A, U1.INP_B]
  out: [U1.OUT_A, U1.INM_A]
  unused: [U1.OUT_B, U1.INM_B]
  gnd: [R2.2, C1.2, U1.VEE]
solver: bias_2v5
checks:
  - {name: vout_v, label: Bias voltage, symbol: "Vbias", kind: dc_level, out: out, tol_pct: 3}
verify:
  load: {out: 10k}
