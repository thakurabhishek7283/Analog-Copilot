id: sallen_key_lp
version: 3
role: filter
title: Sallen-Key low-pass (2nd order)
teach: "Two RC sections with feedback from the output through C1: a 40 dB/decade roll-off, and Q sets how sharp the knee is (0.707 is maximally flat)."
targets:
  fc_hz: {label: Cutoff frequency, unit: hertz, min: 10, max: 20k, default: 1k, scale: log}
  q: {label: Q, unit: unitless, min: 0.5, max: 2, default: "0.707", scale: log}
ports: {in: input, out: output, vcc: power_pos, vee: power_neg, gnd: ground}
rails:
  vcc: {net: VCC, volts: 12, min: 9, max: 15}
  vee: {net: VEE, volts: -12, min: -15, max: -9}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  C1: {part: cap_film}
  C2: {part: cap_film}
  U1: {part: opamp_tl072}
nets:
  in: [R1.1]
  n_a: [R1.2, R2.1, C1.1]
  n_b: [R2.2, C2.1, U1.INP_A]
  out: [U1.OUT_A, U1.INM_A, C1.2]
  gnd: [C2.2]
  vcc: [U1.VCC]
  vee: [U1.VEE]
rules:
  funcs:
    # -3 dB frequency over the natural frequency for a given Q: |H|^2 = 1/2.
    "corner(q)": "sqrt((2 - 1/(q*q) + sqrt((2 - 1/(q*q))*(2 - 1/(q*q)) + 4))/2)"
  solve:
    w0: "2*pi*fc_hz/corner(q)"
    C2: "search(E12, 100p, 1u)"
    C1: "search(E12, C2*(4*q*q)/1.5, min(C2*(4*q*q)*1.5, 10u))"
    r: "1/(w0*sqrt(C1*C2))"
    R1: "search(E24, r/1.3, r*1.3, 1k, 330k)"
    R2: "nearest(E24, 1/(w0*w0*R1*C1*C2), 1k, 330k)"
    rc: "sqrt(R1*R2*C1*C2)"
    qa: "rc/(C2*(R1 + R2))"
  estimates:
    fc_hz: "1/(2*pi*rc)*corner(qa)"
    q: "qa"
  prefer: {R1: 10k, R2: 10k}
checks:
  - {name: fc_hz, label: Cutoff (−3 dB), symbol: "fc", kind: ac_corner, out: out, pass: low, tol_pct: 10}
  - {name: q, label: Q, symbol: "Q", kind: ac_q, out: out, pass: low, tol_pct: 15}
verify:
  drive: {in: {amplitude: 1, frequency: 10}}
  load: {out: 10k}
