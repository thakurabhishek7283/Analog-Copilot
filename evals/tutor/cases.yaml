# The tutor evals' questions and edits (LLD §9, §15), each on a circuit from circuits.yaml.
#
#   kind       ask (default): `question`, optional `selection` ({kind: part, refdes} | {kind: net, id} | {kind: block, id})
#              what_changed: `edit`, the student's ops on top of the circuit ("What changed?")
#   level      beginner | intermediate | advanced;  mode: explain (default) | socratic
#   category   what the case exercises (the report breaks results down by it)
#   expect     optional checks on the answer: `cite` (ids it should cite: R1, net:B2_OUT, block:b2),
#              `try` (yes: it should suggest an experiment; no: it should not), `declines` (off topic)
#   tags       `rubric`: in the 50-question sample the LLM judge grades
#
# Ask categories: why_value, role, change_spec, predict, read_sim, debug, missing_data,
# wrong_premise, off_topic. What-changed categories: check_fails, check_recovers, value_tweak, swap,
# add_remove, rewire, nothing_electrical, analysis, multi_edit.

