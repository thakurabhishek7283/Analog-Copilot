# Generation evals (LLD §15): the prompts evals/run_evals.py runs, each as one generation job.
#
#   id      unique, kebab-case
#   prompt  what the student types
#   level   beginner | intermediate | advanced (GenerateRequest.level)
#   expect  the templates the plan must use: each item is a template id, or a list of ids any one of
#           which will do; each item needs a block of its own, and the plan may hold more blocks.
#           `unsupported`: no template builds it, so the job must fail `unsupported_request`.
#   tags    the roles involved and the kind of prompt (single, chain, vague, injection, scope)
#
# Every template appears in at least two prompts at all three levels between them; targets are inside
# the templates' ranges (registry 2025.09.0). Changing a prompt invalidates the golden cassette:
# re-run the live evals (evals/README.md).

# ---------------------------------------------------------------- filters, one block

- id: rc-lp-1k
  prompt: An RC low-pass filter with a 1 kHz cutoff.
  level: beginner
  expect: [rc_lowpass]
  tags: [filter, single]

- id: rc-lp-audio
  prompt: Filter out everything above about 15 kHz from an audio line using just a resistor and a capacitor.
  level: intermediate
  expect: [rc_lowpass]
  tags: [filter, single]

- id: rc-lp-50
  prompt: Smooth a slow sensor signal with a simple low-pass filter at 50 Hz.
  level: beginner
  expect: [rc_lowpass]
  tags: [filter, single]

- id: rc-hp-100
  prompt: A high-pass filter that blocks DC and passes signals above 100 Hz.
  level: beginner
  expect: [rc_highpass]
  tags: [filter, single]

- id: rc-hp-20k
  prompt: First-order passive high-pass, corner at 20 kHz.
  level: advanced
  expect: [rc_highpass]
  tags: [filter, single]

- id: rc-hp-dc-block
  prompt: I want to remove the DC offset from a signal. Corner frequency around 10 Hz.
  level: intermediate
  expect: [rc_highpass]
  tags: [filter, single]

- id: sk-lp-1k
  prompt: A second-order low-pass filter at 1 kHz using an op-amp.
  level: beginner
  expect: [sallen_key_lp]
  tags: [filter, single]

- id: sk-lp-butterworth
  prompt: Butterworth Sallen-Key low-pass, fc = 3.3 kHz, Q = 0.707.
  level: advanced
  expect: [sallen_key_lp]
  tags: [filter, single]

- id: sk-lp-antialias
  prompt: An anti-aliasing filter in front of an ADC sampling at 44.1 kHz, a 2nd-order active low-pass at 18 kHz.
  level: intermediate
  expect: [sallen_key_lp]
  tags: [filter, single]

- id: sk-lp-peaky
  prompt: Sallen-Key low-pass at 400 Hz with a peaky response, Q of 1.5.
  level: advanced
  expect: [sallen_key_lp]
  tags: [filter, single]

- id: sk-hp-rumble
  prompt: An active high-pass to cut rumble below 80 Hz, second order.
  level: intermediate
  expect: [sallen_key_hp]
  tags: [filter, single]

- id: sk-hp-2k
  prompt: 2nd-order Sallen-Key high-pass, fc 2 kHz, Q 0.9.
  level: advanced
  expect: [sallen_key_hp]
  tags: [filter, single]

- id: sk-hp-beginner
  prompt: An op-amp high-pass filter at 500 Hz that rolls off faster than a plain RC one.
  level: beginner
  expect: [sallen_key_hp]
  tags: [filter, single]

- id: mfb-bp-1k
  prompt: A band-pass filter centred on 1 kHz.
  level: beginner
  expect: [mfb_bandpass]
  tags: [filter, single]

- id: mfb-bp-440
  prompt: Pick out a 440 Hz tone with an active band-pass filter, Q about 3.
  level: intermediate
  expect: [mfb_bandpass]
  tags: [filter, single]

- id: mfb-bp-50
  prompt: Multiple-feedback band-pass, f0 = 50 Hz, Q = 1.2.
  level: advanced
  expect: [mfb_bandpass]
  tags: [filter, single]

