[package]
name = "circuit-core-py"
description = "PyO3 facade over circuit-core, built by maturin into the Python wheel `circuit_core`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "circuit_core_py"
crate-type = ["cdylib"]

[dependencies]
circuit-core = { path = "../circuit-core" }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
serde.workspace = true
serde_json.workspace = true
